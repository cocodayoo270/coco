<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>测测你适合做什么副业？｜分享测试</title>
<meta name="description" content="20道题，43种副业方向，生成专属赚钱出路报告。">
<meta property="og:type" content="website">
<meta property="og:title" content="测测你适合做什么副业？">
<meta property="og:description" content="20道题，从43种副业方向里找到更适合你的赚钱路线。">
<meta property="og:image" content="https://cocodayo.online/side-hustle-test/share-cover.png">
<meta property="og:url" content="https://cocodayo.online/side-hustle-test/share.html">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6ef;color:#16262b;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:34px 20px 50px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#4c7652}
.card{margin:20px 0;background:#152630;color:#fff;border-radius:24px;overflow:hidden;box-shadow:0 13px 28px #17271e23}
.card img{width:100%;display:block}.content{padding:23px}.content h1{font-size:26px;line-height:1.35;margin:0 0 12px}.content p{margin:0;color:#c9d5d0;font-size:14px}
.button{display:block;border:0;text-align:center;border-radius:15px;padding:15px 20px;width:100%;margin:12px 0;font-size:16px;font-weight:750;background:#c5f16c;color:#14232b;cursor:pointer;text-decoration:none}
.button.alt{background:#e2e8e1}.note{font-size:13px;color:#62716e}#status{margin:14px 0;background:white;border:1px solid #dde4da;border-radius:12px;padding:12px 15px;font-size:13px;color:#465b55}
</style>
<script src="https://open.mobile.qq.com/sdk/qqapi.js?_bid=152" defer></script>
</head>
<body>
<main>
<div class="eyebrow">SIDE HUSTLE LAB · QQ 分享实验</div>
<div class="card">
<img src="share-cover.png" alt="副业测试分享封面">
<div class="content"><h1>测测你适合做什么副业？</h1><p>20道题，从43种副业中找到可能更适合自己的方向。免费测试，不承诺收益。</p></div>
</div>
<button type="button" class="button" id="qq">尝试生成 QQ 分享卡片</button>
<a class="button alt" href="./index.html">直接进入副业测试</a>
<button type="button" class="button alt" id="copy">复制测试网址</button>
<div id="status" role="status">请在手机 QQ 内打开本页，再点击第一个按钮。普通浏览器可能无法调用 QQ 分享接口。</div>
<p class="note">此页面仅用于验证 QQ 官方客户端网页分享能力，不是情侣空间邀请，也不会替你发送消息。点击后需要你自己选择好友并确认。若 QQ 不支持此接口，会保留普通链接方式。</p>
</main>
<script>
(function(){
const testUrl='https://cocodayo.online/side-hustle-test/';
const shareUrl='https://cocodayo.online/side-hustle-test/share.html';
const cover='https://cocodayo.online/side-hustle-test/share-cover.png';
const shareInfo={title:'测测你适合做什么副业？',desc:'20道题，43种副业方向，生成专属报告。',image_url:cover,share_url:shareUrl};
const status=document.getElementById('status');
function say(t){status.textContent=t}
function qqReady(){return typeof window.mqq!=='undefined'&&window.mqq.data&&typeof window.mqq.data.setShareInfo==='function'}
function configure(){if(qqReady()){try{window.mqq.data.setShareInfo(shareInfo);say('已尝试配置 QQ 分享信息。点击「尝试生成 QQ 分享卡片」，或使用右上角的分享功能。');return true}catch(e){say('QQ 分享信息配置失败：'+String(e.message||e));return false}}say('当前没有检测到 QQ 网页分享接口。请尝试在手机 QQ 内打开此页面，而不是系统浏览器。');return false}
document.getElementById('qq').addEventListener('click',()=>{
 if(!configure())return;
 try{
 if(window.mqq.ui&&typeof window.mqq.ui.showShareMenu==='function'){window.mqq.ui.showShareMenu();say('已请求打开 QQ 分享菜单；如果未弹出，请点页面右上角分享。')}
 else say('已设置分享卡片信息，但当前 QQ 版本不支持直接弹出分享菜单。请用右上角分享。')
 }catch(e){say('打开分享菜单失败，请试右上角分享：'+String(e.message||e))}
});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(testUrl);say('已复制正确的副业测试网址。')}catch(e){say('复制受浏览器限制，请手动复制：'+testUrl)}});
window.addEventListener('load',()=>setTimeout(configure,450));
})();
</script>
</body>
</html>
