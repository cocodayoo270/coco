<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>超自然行动组：随机道具抽取</title>
    
    <meta name="apple-mobile-web-app-title" content="道具大转盘">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/150/ff0000/ghost.png">

    <style>
        /* 整体黑底红边的赛博感样式 */
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 标题红光效果 */
        h1 {
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #8b0000;
            font-size: 1.8rem;
            margin-bottom: 2rem;
        }

        /* 显示抽取结果的区域 */
        #result {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 15px #ff0000;
            height: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 3rem;
            padding: 0 20px;
        }

        /* 核心抽取按钮：红黑发光设计 */
        #draw-btn {
            background: linear-gradient(145deg, #330000, #000);
            border: 2px solid #ff0000;
            color: #ff0000;
            padding: 1.2rem 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 0 15px #ff0000, inset 0 0 10px #330000;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #draw-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px #ff0000;
            background: #ff0000;
            color: #000;
        }

        /* 底部提示文字 */
        .footer {
            position: absolute;
            bottom: 20px;
            color: #444;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <h1>超自然行动组</h1>

    <div id="result">准备好抽取了吗？</div>

    <button id="draw-btn" onclick="drawItem()">START DRAW</button>

    <div class="footer">由 Cloudflare Pages 提供永久支持</div>

    <script>
        // 在这里填写你的游戏道具列表
        const items = ["道具 A", "道具 B", "道具 C", "道具 D", "道具 E", "道具 F"];

        function drawItem() {
            const btn = document.getElementById('draw-btn');
            const resultDiv = document.getElementById('result');
            
            // 按钮禁用防止连点
            btn.disabled = true;
            resultDiv.style.opacity = "0.5";
            
            // 模拟随机滚动的视觉动画
            let count = 0;
            const interval = setInterval(() => {
                const randomTemp = items[Math.floor(Math.random() * items.length)];
                resultDiv.innerText = randomTemp;
                count++;
                
                if (count > 10) {
                    clearInterval(interval);
                    // 最终确定结果
                    const finalItem = items[Math.floor(Math.random() * items.length)];
                    resultDiv.innerText = finalItem;
                    resultDiv.style.opacity = "1";
                    btn.disabled = false;
                }
            }, 80);
        }
    </script>
</body>
</html>
